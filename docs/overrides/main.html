{% extends "base.html" %}

{% block extrahead %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ 'assets/apple-touch-icon.png' | url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ 'assets/favicon-32.png' | url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ 'assets/favicon-16.png' | url }}">
  <meta name="theme-color" content="#15191A">
  <meta property="og:title" content="{{ config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:image" content="{{ config.site_url }}assets/avatar-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ config.site_name }}">
  <meta name="twitter:description" content="{{ config.site_description }}">
  <meta name="twitter:image" content="{{ config.site_url }}assets/avatar-512.png">
{% endblock %}
