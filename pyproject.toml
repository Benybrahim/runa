[project]
name = "runa"
version = "0.1.0"
description = "The application framework for agentic AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "openai-agents[litellm,redis,sqlalchemy,viz]>=0.22.0",
]

[project.scripts]
runa = "runa.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "D",   # docstring
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["src", "tests", "examples"]
# Tool.call is deliberately overridden with a bespoke, concretely-typed
# signature per subclass (see tool.py's docstring and _schema_from_signature,
# which derives a Tool's JSON schema from that signature via reflection).
# That's the documented interface, not an LSP violation pyright should flag.
reportIncompatibleMethodOverride = false
